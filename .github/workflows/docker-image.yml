name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      # Throwaway hash for CI only (password "ci") - never ship this image
      run: |
        docker build -t kali-unattended-builder:$(date +%s) \
          --build-arg USER_PASSWORD_HASH="$(openssl passwd -6 -salt ci ci)" \
          -f x86_64/everything.dockerfile .
